<ion-content [fullscreen]="true">
  <div class="auth-layout">
    <a routerLink="/" class="brand-link">
      <span class="brand-mark">⚔</span> DotaCoach
    </a>

    <form class="auth-card" (submit)="onSubmit($event)" novalidate>
      <h1 class="text-h1">Recuperar contraseña</h1>
      <p class="text-subdued auth-subtitle">
        Ingresá el email asociado a tu cuenta y te enviamos instrucciones para
        recuperar el acceso.
      </p>

      @if (submitted()) {
        <div class="alert alert-error" role="alert">
          🚧 Esta función estará disponible muy pronto. Mientras tanto,
          escribinos a <a href="mailto:soporte@dotacoach.app" class="link-accent">soporte&#64;dotacoach.app</a>
          y te ayudamos manualmente.
        </div>
      }

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="tu@email.com" required />
      </div>

      <button type="submit" class="btn btn-primary btn-block">
        Enviar instrucciones
      </button>

      <div class="divider"><span>o</span></div>

      <p class="auth-footer">
        <a routerLink="/login" class="link-accent">← Volver al login</a>
      </p>
    </form>
  </div>
</ion-content>
